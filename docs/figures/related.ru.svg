  <path class="arrow" d="M166 638 L196 638"/>
  <g class="gray">
    <rect x="198" y="610" width="126" height="56" rx="8" stroke-width="1.5"/>
    <text class="title" x="261.0" y="635.0" text-anchor="middle">Дисперсия</text>
    <text class="sub" x="261.0" y="653.0" text-anchor="middle">тренд и шум</text>
  </g>
