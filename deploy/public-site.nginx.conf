# The public results page: a static folder, and nothing else.
#
# The `publish` compose service writes PUBLISH_DIR; this serves it. There is
# deliberately no `proxy_pass` anywhere in here -- the api is not part of the
# public site, and its read routes (open while READ_TOKEN is unset) include
# /principals, model artifacts and station health.
#
# Install on the host, then let certbot add the TLS lines:
#   sudo cp deploy/public-site.nginx.conf /etc/nginx/sites-available/ionograms-public
#   (edit server_name and root)
#   sudo ln -s /etc/nginx/sites-available/ionograms-public /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d iono.example.org

server {
    listen 80;
    listen [::]:80;
    server_name iono.example.org;              # your domain

    root /srv/ionograms-public;                # = PUBLISH_DIR in deploy/.env
    index index.html;

    # Same-origin everything: the page loads no CDN, no fonts, no inline code.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    # Temporaries the publisher renames into place, and anything else hidden.
    location ~ /\. { deny all; return 404; }

    # Named for the sounding's own time and never rewritten: cache for good.
    location /img/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rewritten every pass. Revalidate each time; the ETag makes an unchanged
    # file a 304, because the publisher leaves unchanged files untouched.
    location ~ \.json$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }
}
