# Temporary test rig: api + web on one host, plus a simulated station.
#
#   cp deploy/.env.example deploy/.env   and edit it
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up --build
#
# BIND_ADDR defaults to 127.0.0.1. This service can stop acquisition on a
# radio, so reaching it from the sounding laptop is a deliberate act: set
# BIND_ADDR to the LAN address of this machine, and understand that the only
# thing between the LAN and the stop button is CONTROL_TOKEN over plain HTTP.
# Across untrusted networks, tunnel it instead -- see deploy/README.md.

name: ionograms

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        # An image built here is a working copy, not a commit, and `/healthz`
        # should say so rather than name a SHA whose tree it may not match.
        # Override deliberately: API_BUILD_SHA=$(git rev-parse --short HEAD).
        API_BUILD_SHA: "${API_BUILD_SHA:-local build}"
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      API_DB: /data/ionograms.sqlite3
      ARCHIVE_ROOT: /archive
      # Which language a browser with no cookie gets. Per-browser
      # choice still wins, from the EN/RU toggle in the header.
      UI_LANG: "${UI_LANG:-en}"
      # Passed in so the archives page can show *which host folder* is
      # mounted at ARCHIVE_ROOT. The container cannot discover this on its
      # own -- a bind mount looks like an ordinary directory from inside --
      # and "/archive" alone does not tell an operator whether the .env they
      # edited took effect. Display only; the mount below is what binds.
      ARCHIVE_HOST_PATH: "${ARCHIVE_HOST_PATH:-./archive}"
      # Extra roots, beyond ARCHIVE_ROOT. Colon-separated container paths --
      # the "array" that a volume spec cannot hold, in the one place it can.
      #
      # A variable inside `volumes:` is string substitution into a single list
      # item, so ARCHIVE_HOST_PATH="/a:/b" becomes the one broken mount
      # "/a:/b:/archive:ro" rather than two mounts. Each extra path therefore
      # needs its own volume line below AND its container path listed here.
      # Both, and a redeploy: a container's filesystem is fixed when it starts.
      ARCHIVE_ROOTS: "${ARCHIVE_ROOTS:-}"
      ARCHIVE_HOST_PATH_2: "${ARCHIVE_HOST_PATH_2:-}"
      ARCHIVE_HOST_PATH_3: "${ARCHIVE_HOST_PATH_3:-}"
      # Background scanning. The interval is the unattended pass; SCAN_BATCH
      # caps how much ONE such pass ingests, so the box stays responsive while
      # a large folder is worked through over several of them. A scan pressed
      # on the archives page ignores the cap and runs the folder to the end --
      # that is someone asking, and it reports progress while it goes.
      # ARCHIVE_SCAN_INTERVAL_S=0 turns the unattended loop off entirely.
      ARCHIVE_SCAN_INTERVAL_S: "${ARCHIVE_SCAN_INTERVAL_S:-900}"
      ARCHIVE_SCAN_BATCH: "${ARCHIVE_SCAN_BATCH:-200}"
      # How often the progress bar advances: a scan commits and reports every
      # CHUNK soundings. Smaller moves the bar more smoothly at the cost of
      # more transactions; larger is fractionally faster and looks stuck.
      ARCHIVE_SCAN_CHUNK: "${ARCHIVE_SCAN_CHUNK:-50}"
      # Worker processes per scan. 1 keeps indexing on one core; 4 was
      # 2.7x faster on the 10-core work server, and 8 was *slower* than
      # 4, because each chunk builds its own pool. Raise CHUNK with it.
      ARCHIVE_SCAN_JOBS: "${ARCHIVE_SCAN_JOBS:-1}"
      # Solar indices for IRI cache here, on the volume rather than in the
      # image: `$HOME` is a container layer, so without this every `pull`
      # discards ~5 MB of index files and the next model run re-downloads them.
      MUF_INDEX_CACHE: /data/indices
      READ_TOKEN: "${READ_TOKEN:-}"
      CONTROL_TOKEN: "${CONTROL_TOKEN:?set CONTROL_TOKEN in deploy/.env}"
    volumes:
      - api-data:/data
      # Uploaded artifacts, quarantined. Its own volume rather than a corner of
      # `models`, and read-write here: the api has to be able to put a file
      # down, and must never be able to put one where `infer` runs code from.
      # Nothing in this container ever opens what lands here.
      - model-uploads:/uploads
      # Read-only, and it stays read-only. The api renders from the archive and
      # has no business writing to it.
      - "${ARCHIVE_HOST_PATH:-./archive}:/archive:ro"
      # Extra archives. Unset, these mount the same folder as /archive again,
      # which is harmless and shows nothing new -- they only come into play
      # once ARCHIVE_ROOTS names them. Add more pairs the same way.
      - "${ARCHIVE_HOST_PATH_2:-${ARCHIVE_HOST_PATH:-./archive}}:/archive2:ro"
      - "${ARCHIVE_HOST_PATH_3:-${ARCHIVE_HOST_PATH:-./archive}}:/archive3:ro"
    restart: unless-stopped

  # Inference, built from this checkout. Its own image: the model libraries
  # stay out of the api image and the web stack stays out of this one.
  infer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.infer
    depends_on:
      api:
        condition: service_healthy
    command: >
      python -m services.prediction.infer
      --param ${PREDICT_PARAMS:-muf,lof}
      --method ${PREDICT_METHOD:-contour}
      --interval ${PREDICT_INTERVAL_S:-21600}
    environment:
      API_DB: /data/ionograms.sqlite3
      MUF_INDEX_CACHE: /indices
    # No server in here, so an inherited healthcheck could only ever fail.
    healthcheck:
      disable: true
    volumes:
      - api-data:/data
      - models:/models:ro
      - indices:/indices
    restart: unless-stopped

  # Registers a model file that is already on the models volume:
  #
  #   docker compose --profile import run --rm importer /models/<file> --param muf
  importer:
    profiles: ["import"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.train
    entrypoint: ["python", "-m", "services.prediction.importer"]
    environment:
      API_DB: /data/ionograms.sqlite3
      MUF_INDEX_CACHE: /indices
    volumes:
      - api-data:/data
      - models:/models:ro
      - indices:/indices
    restart: "no"

  station-sim:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.station
    depends_on:
      api:
        condition: service_healthy
    environment:
      AGENT_CONFIG: /etc/agent/station.json
      # The sim authenticates with the same secret the api checks. It arrives
      # from deploy/.env rather than from station.json because that file is
      # committed -- pasting the token into it would leave a live credential
      # in the repository. Same reason CONTROL_TOKEN reaches the api this way.
      AGENT_TOKEN: "${CONTROL_TOKEN:?set CONTROL_TOKEN in deploy/.env}"
      # Log the verb instead of running it: there is no systemd in here, so
      # without this the command path can be queued and delivered but never
      # seen to succeed.
      AGENT_FAKE_SYSTEMCTL: "1"
    volumes:
      - ./station-sim.json:/etc/agent/station.json:ro
      - sim-products:/var/lib/station/products
    restart: unless-stopped

  # The two workers that open what the console sends.
  #
  # Neither listens on anything, and that is the whole point: the api takes
  # bytes and queues a row; a process no request can reach is what unpickles an
  # artifact or fits a model. `services/prediction/importer.py` refused an HTTP
  # import route for that reason, and this is how the refusal survives the
  # console growing an upload button.
  #
  # Same image as `train` and `importer` -- it may have to load a Keras model
  # to introspect one, and neither process imports tensorflow unless it does.
  #
  # `models` is read-write in these two and **only** in these two. `infer`
  # keeps `:ro`: a process that runs code out of an artifact should not be able
  # to replace one.
  registrar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.train
    command: >
      python -m services.prediction.registrar
      --interval ${MODEL_REGISTRAR_INTERVAL_S:-10}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DB: /data/ionograms.sqlite3
      MODEL_STORE: /models
      MODEL_UPLOADS: /uploads
      MUF_INDEX_CACHE: /indices
    # No server in here, so an inherited healthcheck could only ever fail.
    healthcheck:
      disable: true
    volumes:
      - api-data:/data
      - model-uploads:/uploads
      - models:/models
      - indices:/indices
    restart: unless-stopped

  # Separate from the registrar, not folded into it: a fit takes minutes and an
  # upload settles in seconds, and one worker draining both queues would leave
  # an operator watching a spinner for the length of somebody else's training
  # run.
  trainer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.train
    command: >
      python -m services.prediction.trainer
      --interval ${MODEL_TRAINER_INTERVAL_S:-60}
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DB: /data/ionograms.sqlite3
      MODEL_STORE: /models
      MUF_INDEX_CACHE: /indices
    healthcheck:
      disable: true
    volumes:
      - api-data:/data
      - models:/models
      - indices:/indices
    restart: unless-stopped

volumes:
  api-data:
  # Artifacts uploaded from the console, before anything has opened them.
  # Separate from `models` so that the api can write here without being able to
  # write there.
  model-uploads:
  sim-products:
  models:
  indices:
