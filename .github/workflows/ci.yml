# Test, then publish. Never the second without the first.
#
# `publish` depends on `test`, so a red suite cannot produce an image. That
# ordering is the point of having this in CI rather than in a script on
# somebody's laptop: the work server pulls what this pushes, unattended.
name: ci

on:
  push:
    branches: [develope, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # Cheap and first. A lint failure is a one-line fix, and finding it after a
  # four-minute test run wastes the time it was meant to save.
  #
  # `ruff`'s config pins `target-version = "py38"` -- see pyproject.toml for
  # why that is not `requires-python`. The matching runtime check is
  # `tests/test_agent.py::test_the_agent_stays_within_python_38`, which runs in
  # the job below: this stops a linter *suggesting* 3.9+ syntax for the
  # station's agent, and that stops it arriving any other way.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # numpy<2 matches deploy/requirements-api.txt and the machine the
          # numerics were verified on. httpx2 is what starlette's TestClient
          # needs; it is test-only and deliberately not in pyproject.
          pip install -e ".[test,parquet]" "numpy<2.0" \
                      fastapi "uvicorn[standard]" jinja2 httpx2

      - name: Tests
        # MUF_TEST_DATA is unset here, so tests needing real recordings skip
        # rather than fail. Correctness is established on synthetic soundings
        # by design -- see the README's Layout section.
        run: python -m pytest tests -q

  publish:
    needs: [lint, test]
    # Pull requests are tested, not published: a fork must not be able to push
    # an image the work server would then pull.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub's own registry, pushed with the workflow's token -- no secret to
      # set, and the one registry the work server could still reach on
      # 2026-09-27, when Docker Hub's blob CDN timed out from it on every pull.
      packages: write
    env:
      # Resolved at *job* level, not workflow level: `secrets` is unavailable
      # in a workflow-level `env`, so a namespace added under the Secrets tab
      # instead of the Variables tab silently became empty and fell back to the
      # GitHub owner. The push then went to a namespace the token does not own
      # and failed with `insufficient_scope`, naming a repository nobody had
      # asked for.
      #
      # The Docker Hub *username* is the default, because the namespace equals
      # it unless you are pushing into an organisation. `DOCKERHUB_NAMESPACE`
      # is only needed for that case, and is accepted from either tab.
      NAMESPACE: >-
        ${{ vars.DOCKERHUB_NAMESPACE
            || secrets.DOCKERHUB_NAMESPACE
            || secrets.DOCKERHUB_USERNAME
            || github.repository_owner }}
    strategy:
      # One image failing must not cancel the others. The default is to cancel
      # them, and it turned a `tensorflow-cpu` wheel missing on arm64 -- a
      # problem in the *training* image, which nothing starts automatically --
      # into `ionograms-infer` never being pushed, which stopped the work
      # server coming up at all. The images are independent; the matrix should
      # treat them that way.
      fail-fast: false
      matrix:
        include:
          - image: ionograms-api
            dockerfile: deploy/Dockerfile.api
          - image: ionograms-station
            dockerfile: deploy/Dockerfile.station
          # Every image the compose files name has to be here. `infer` is not
          # behind a profile in docker-compose.hub.yml, so a plain `up -d` on
          # the work server pulls it -- and an image the matrix does not build
          # fails that pull with `not found`, taking the whole stack down with
          # it rather than just the one service.
          - image: ionograms-infer
            dockerfile: deploy/Dockerfile.infer
          - image: ionograms-train
            dockerfile: deploy/Dockerfile.train
    steps:
      - uses: actions/checkout@v4

      # Registry credentials are a repository setting, not something the code
      # can carry, so a fresh clone and a fork both arrive here without them.
      # Checked first and reported as a notice, because the alternative is
      # `login-action` failing with "Username and password required" -- true,
      # but it names neither the secret nor where to put it, and it turns a
      # green pipeline red for a reason that has nothing to do with the commit.
      - id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub skipped::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings -> Secrets and variables -> Actions) to publish there too. Images still go to ghcr.io."
            {
              echo "### Docker Hub skipped"
              echo
              echo "\`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` are not set on this repository."
              echo "Images were still published to ghcr.io; only the Docker Hub push was skipped."
              echo
              echo "Add them under **Settings -> Secrets and variables -> Actions**."
              echo "\`DOCKERHUB_TOKEN\` is a Docker Hub *access token* with Read & Write, not the account password."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Namespace
        env:
          FROM_VAR: ${{ vars.DOCKERHUB_NAMESPACE }}
          FROM_SECRET: ${{ secrets.DOCKERHUB_NAMESPACE }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: steps.creds.outputs.ready == 'true'
        run: |
          if   [ -n "$FROM_VAR" ];    then src="repository variable DOCKERHUB_NAMESPACE"
          elif [ -n "$FROM_SECRET" ]; then src="repository secret DOCKERHUB_NAMESPACE"
          else                             src="DOCKERHUB_USERNAME"
          fi
          echo "::notice title=Pushing as::namespace from ${src}; images ${NAMESPACE}/ionograms-{api,station,infer,train}"
          # The token can only push to a namespace it owns or is a member of.
          # Saying so here turns `insufficient_scope` from a registry mystery
          # into a one-line mismatch.
          if [ -n "$HUB_USERNAME" ] && [ "$NAMESPACE" != "$HUB_USERNAME" ]; then
            echo "::warning title=Namespace differs from the account::Pushing to '${NAMESPACE}' while authenticated as '${HUB_USERNAME}'. That is correct only for a Docker Hub organisation the account belongs to; otherwise the push fails with insufficient_scope."
          fi

      - id: ghcr
        run: echo "path=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # The work server is amd64, the development machine arm64. Building both
      # means `docker pull` gives each the right one without either knowing --
      # and it is why this belongs in CI, since cross-building scipy and
      # opencv locally is slow enough that people stop doing it.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        if: steps.creds.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Both registries get the same tags. Docker Hub only when its
          # credentials are set; ghcr.io always.
          images: |
            name=${{ steps.ghcr.outputs.path }}/${{ matrix.image }}
            name=${{ env.NAMESPACE }}/${{ matrix.image }},enable=${{ steps.creds.outputs.ready == 'true' }}
          # `sha-` on every build, always: it is the tag a rollback names, and
          # `latest` tells you nothing about what is actually running. `latest`
          # moves only on the default branch, because that is what the work
          # server's watcher follows.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - id: stamp
        # `committed`: when the code last changed, which is what the page
        # header shows as "updated" -- see services/api/build.py.
        run: |
          echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "committed=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          # Stamped into the image and served at `/healthz`, so "which build is
          # on the server?" is one curl. Without it the only evidence is the
          # behaviour of the code you are trying to confirm is deployed --
          # which cost two four-minute page loads to establish once already.
          build-args: |
            API_BUILD_SHA=${{ github.sha }}
            API_BUILD_TIME=${{ steps.stamp.outputs.at }}
            API_COMMIT_TIME=${{ steps.stamp.outputs.committed }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
