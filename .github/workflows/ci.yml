# Test, then publish. Never the second without the first.
#
# `publish` depends on `test`, so a red suite cannot produce an image. That
# ordering is the point of having this in CI rather than in a script on
# somebody's laptop: the work server pulls what this pushes, unattended.
name: ci

on:
  push:
    branches: [develope, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # numpy<2 matches deploy/requirements-api.txt and the machine the
          # numerics were verified on. httpx2 is what starlette's TestClient
          # needs; it is test-only and deliberately not in pyproject.
          pip install -e ".[test,parquet]" "numpy<2.0" \
                      fastapi "uvicorn[standard]" jinja2 httpx2

      - name: Tests
        # MUF_TEST_DATA is unset here, so tests needing real recordings skip
        # rather than fail. Correctness is established on synthetic soundings
        # by design -- see the README's Layout section.
        run: python -m pytest tests -q

  publish:
    needs: test
    # Pull requests are tested, not published: a fork must not be able to push
    # an image the work server would then pull.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Resolved at *job* level, not workflow level: `secrets` is unavailable
      # in a workflow-level `env`, so a namespace added under the Secrets tab
      # instead of the Variables tab silently became empty and fell back to the
      # GitHub owner. The push then went to a namespace the token does not own
      # and failed with `insufficient_scope`, naming a repository nobody had
      # asked for.
      #
      # The Docker Hub *username* is the default, because the namespace equals
      # it unless you are pushing into an organisation. `DOCKERHUB_NAMESPACE`
      # is only needed for that case, and is accepted from either tab.
      NAMESPACE: >-
        ${{ vars.DOCKERHUB_NAMESPACE
            || secrets.DOCKERHUB_NAMESPACE
            || secrets.DOCKERHUB_USERNAME
            || github.repository_owner }}
    strategy:
      matrix:
        include:
          - image: ionograms-api
            dockerfile: deploy/Dockerfile.api
          - image: ionograms-station
            dockerfile: deploy/Dockerfile.station
    steps:
      - uses: actions/checkout@v4

      # Registry credentials are a repository setting, not something the code
      # can carry, so a fresh clone and a fork both arrive here without them.
      # Checked first and reported as a notice, because the alternative is
      # `login-action` failing with "Username and password required" -- true,
      # but it names neither the secret nor where to put it, and it turns a
      # green pipeline red for a reason that has nothing to do with the commit.
      - id: creds
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Images not published::Set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Settings -> Secrets and variables -> Actions) to publish. Tests ran and passed; only the push was skipped."
            {
              echo "### Images not published"
              echo
              echo "\`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` are not set on this repository."
              echo "The test job ran normally; only the registry push was skipped."
              echo
              echo "Add them under **Settings -> Secrets and variables -> Actions**."
              echo "\`DOCKERHUB_TOKEN\` is a Docker Hub *access token* with Read & Write, not the account password."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Namespace
        env:
          FROM_VAR: ${{ vars.DOCKERHUB_NAMESPACE }}
          FROM_SECRET: ${{ secrets.DOCKERHUB_NAMESPACE }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        if: steps.creds.outputs.ready == 'true'
        run: |
          if   [ -n "$FROM_VAR" ];    then src="repository variable DOCKERHUB_NAMESPACE"
          elif [ -n "$FROM_SECRET" ]; then src="repository secret DOCKERHUB_NAMESPACE"
          else                             src="DOCKERHUB_USERNAME"
          fi
          echo "::notice title=Pushing as::namespace from ${src}; images ${NAMESPACE}/ionograms-{api,station}"
          # The token can only push to a namespace it owns or is a member of.
          # Saying so here turns `insufficient_scope` from a registry mystery
          # into a one-line mismatch.
          if [ -n "$HUB_USERNAME" ] && [ "$NAMESPACE" != "$HUB_USERNAME" ]; then
            echo "::warning title=Namespace differs from the account::Pushing to '${NAMESPACE}' while authenticated as '${HUB_USERNAME}'. That is correct only for a Docker Hub organisation the account belongs to; otherwise the push fails with insufficient_scope."
          fi

      # The work server is amd64, the development machine arm64. Building both
      # means `docker pull` gives each the right one without either knowing --
      # and it is why this belongs in CI, since cross-building scipy and
      # opencv locally is slow enough that people stop doing it.
      - uses: docker/setup-qemu-action@v3
        if: steps.creds.outputs.ready == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.creds.outputs.ready == 'true'

      - uses: docker/login-action@v3
        if: steps.creds.outputs.ready == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        if: steps.creds.outputs.ready == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NAMESPACE }}/${{ matrix.image }}
          # `sha-` on every build, always: it is the tag a rollback names, and
          # `latest` tells you nothing about what is actually running. `latest`
          # moves only on the default branch, because that is what the work
          # server's watcher follows.
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        if: steps.creds.outputs.ready == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
