<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oblique ionospheric sounding</title>
<meta name="description" content="Live oblique ionospheric sounding results: ionograms, maximum usable frequency and forecast.">
<link rel="stylesheet" href="style.css">
<script src="echo.js" defer></script>
<script src="app.js" defer></script>
<script data-goatcounter="https://volgatech-itrc.goatcounter.com/count" async src="vendor/count.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div>
      <h1 data-t="title">Oblique ionospheric sounding</h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
    <div class="meta">
      <button type="button" id="lang" class="link"></button>
      <button type="button" id="theme" class="link"></button>
      <span id="updated" class="muted"></span>
      <span id="link" class="link-state" hidden></span>
    </div>
  </div>
</header>

<main class="wrap">
  <p id="banner" class="banner" hidden></p>
  <section id="now" class="card now">
    <h2 data-t="now"></h2>
    <p id="now-state" class="muted"></p>
    <div id="now-list"></div>
  </section>

  <nav id="circuits" class="tabs" aria-label="Circuits"></nav>

  <section id="circuit" hidden>
    <p id="path" class="muted"></p>

    <div class="card">
      <h2 data-t="latest"></h2>
      <figure class="latest">
        <img id="latest-img" alt="" width="640" height="280">
        <figcaption id="latest-cap"></figcaption>
      </figure>
      <h3 data-t="last_24h"></h3>
      <div id="strip" class="strip"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2 data-t="series"></h2>
        <div class="controls">
          <div id="zoom" class="seg" role="group"></div>
          <div id="ranges" class="seg" role="group"></div>
        </div>
      </div>
      <div id="chart" class="chart"></div>
      <div id="legend" class="legend"></div>
      <p class="note" data-t="chart_hint"></p>
    </div>

    <div class="card">
      <h2 data-t="forecast"></h2>
      <p class="note" data-t="experimental"></p>
      <div id="forecast"></div>
    </div>
  </section>

  <section id="archive" class="card" hidden>
    <h2 data-t="archive"></h2>
    <p class="note" data-t="archive_hint"></p>
    <div class="controls past-controls">
      <label><span data-t="archive_circuit"></span> <select id="past-circuit"></select></label>
      <label><span data-t="archive_day"></span> <select id="past-day"></select></label>
      <label><span data-t="archive_time"></span> <select id="past-time"></select></label>
    </div>
    <canvas id="past-canvas" class="past" width="960" height="420"></canvas>
    <p id="past-state" class="muted"></p>
    <div class="controls past-controls">
      <label><span data-t="archive_row"></span> <select id="past-row"></select></label>
      <label><span data-t="archive_pad"></span> <select id="past-pad"></select></label>
      <label><span data-t="archive_low"></span> <input id="past-low" type="range" min="0" max="50" step="1"></label>
      <label><span data-t="archive_high"></span> <input id="past-high" type="range" min="45" max="110" step="1"></label>
      <a id="past-file" class="link" hidden></a>
    </div>
  </section>
</main>

<footer class="wrap foot">
  <p class="muted" data-t="about"></p>
  <p class="muted" id="build"></p>
</footer>
</body>
</html>
