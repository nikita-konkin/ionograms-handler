<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ionograms{% endblock %}</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2b3039;
    --ink: #e6e8ec; --dim: #9aa3b2;
    --ok: #4ac26b; --fail: #e5534b; --unknown: #6b7280; --accent: #58a6ff;
    --warn: #d29922;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --panel:#fff; --line:#dfe3e8; --ink:#1b1f24;
            --dim:#5b6673; --unknown:#98a1ad; --warn:#9a6700; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { border-bottom:1px solid var(--line); padding:.7rem 1rem;
           display:flex; gap:1.2rem; align-items:baseline; flex-wrap:wrap; }
  header b { font-size:1rem; }
  nav a { color:var(--dim); text-decoration:none; margin-right:1rem; }
  nav a:hover, nav a.on { color:var(--accent); }
  main { padding:1rem; max-width:1400px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:8px; padding:1rem; margin-bottom:1rem; }
  h2 { margin:.2rem 0 .8rem; font-size:1rem; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:.3rem .6rem; border-bottom:1px solid var(--line);
          white-space:nowrap;
          /* A row is as tall as its tallest cell, and `td.wrap` below lets one
             cell run to several lines. Centred, every short cell beside it
             floats to the middle of that height and the row reads as blank
             with something stranded in it. Top-aligned, the name stays level
             with the first line of the text explaining it. No effect on
             single-line rows, which is most of them. */
          vertical-align:top; }
  th { color:var(--dim); font-weight:normal; }
  td.wrap { white-space:normal; color:var(--dim); }
  .scroll { overflow-x:auto; }
  .pill { display:inline-block; padding:.05rem .5rem; border-radius:999px;
          font-size:.8rem; border:1px solid var(--line); }
  .ok    { color:var(--ok);      border-color:var(--ok); }
  .fail  { color:var(--fail);    border-color:var(--fail); }
  .unk   { color:var(--unknown); border-color:var(--unknown); }
  .warn  { color:var(--warn);    border-color:var(--warn); }
  .muted { color:var(--dim); }
  button { font:inherit; background:var(--panel); color:var(--ink);
           border:1px solid var(--line); border-radius:6px;
           padding:.3rem .8rem; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  input { font:inherit; background:var(--bg); color:var(--ink);
          border:1px solid var(--line); border-radius:6px; padding:.3rem .5rem; }
  a { color:var(--accent); }
  .note { color:var(--dim); font-size:.85rem; }
  img.iono { max-width:100%; border:1px solid var(--line); border-radius:6px; }
</style>
</head>
<body>
<header>
  <b>ionograms-handler</b>
  <nav>
    <a href="/ui">console</a>
    <a href="/ui/series">series</a>
    <a href="/ui/soundings">soundings</a>
    <a href="/ui/sources">sources</a>
    <a href="/ui/archives">archives</a>
    <a href="/docs">api</a>
  </nav>
  <span class="note" style="margin-left:auto">{% block hint %}{% endblock %}</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
